<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap" rel="stylesheet">
  <style>
    body { width: 250px; padding: 12px; background: #0f0f0f; color: #eee; font-family: 'Rubik', sans-serif; margin: 0; }
    .container { 
  display: flex; 
  flex-direction: column; 
  gap: 6px; /* ЦЕЙ ПАРАМЕТР ВІДПОВІДАЄ ЗА ВЕРТИКАЛЬНИЙ ВІДСТУП */
}
    .row { display: flex; gap: 4px; align-items: center; }
    button { cursor: pointer; border: none; border-radius: 6px; font-weight: 500; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; outline: none; font-family: inherit; }
    .btn-search { flex: 1; height: 38px; text-transform: uppercase; text-shadow: 2px 2px 3px rgba(0,0,0,0.8); color: #fff; }
    .btn-search:hover {
  transform: scale(1.02); /* Трохи більше збільшення */
  text-shadow: 2px 2px 5px rgba(0,0,0,1); /* Посилюємо припіднятість тексту */
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  z-index: 10;
}
    .mini-group { flex: 1; display: flex; gap: 4px; }
    .btn-mini { flex: 1; height: 38px; text-transform: uppercase; text-shadow: 2px 2px 3px rgba(0,0,0,0.8); color: #fff; }
    .btn-mini:hover {
  transform: scale(1.03); /* Значне збільшення для маленької кнопки */
  text-shadow: 2px 2px 5px rgba(0,0,0,1); /* 2px 2px 3px rgba(0,0,0,0.8); */
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  z-index: 10; /* Щоб при збільшенні вона була над іншими */
}
    .btn-go { width: 42px; height: 38px; background: #1a1a1a; color: #00ff88; font-size: 18px; border: 1px solid #333; }
    .btn-go:hover {
  transform: scale(1.04); /* Блискавка дуже маленька, тому 1.2 буде в самий раз */
  filter: brightness(1.01);
  text-shadow: 0 0 4px rgba(255, 149, 0, 0.5), 0 0 12px rgba(255, 200, 0, 0.3); /* Ефект світіння білий: (255,255,255,0.5); */
  box-shadow: 0 0 4px rgba(255, 149, 0, 0.3), 0 4px 8px rgba(0, 0, 0, 0.5); /* Темна тінь: 0 3px 10px rgba(0,0,0,0.4); */
  z-index: 10;
}
    button:hover { filter: brightness(1.01); transform: scale(1.02); }
    #hint { font-size: 10px; color: #777; margin-bottom: 10px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="hint">Виділіть назву на сторінці</div>
  <div class="container" id="main-container"></div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
