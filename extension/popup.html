<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script src="theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f0f; --text: #eee; --muted: #777; --go-bg: #1a1a1a; --go-border: #333;
      --line: #222; --chip-bg: #1c1c1c; --chip-border: #2c2c2c; --chip-text: #bbb; --chip-hover: #fff;
      --accent: #44BBA4; --on-accent: #111;
      --outer: #060606; --frame-border: #333; --frame-shadow: rgba(0,0,0,.6);
      --btn-shadow: 0 1px 2px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.22);
      --btn-shadow-hover: 0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 0 rgba(0,0,0,.22);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f5f7; --text: #222; --muted: #6b7280; --go-bg: #ffffff; --go-border: #d9dde2;
      --line: #e1e4e8; --chip-bg: #ffffff; --chip-border: #d9dde2; --chip-text: #444; --chip-hover: #111;
      --accent: #2a9d87; --on-accent: #fff;
      --outer: #e4e7eb; --frame-border: #d9dde2; --frame-shadow: rgba(0,0,0,.12);
      --btn-shadow: 0 1px 2px rgba(16,24,40,.22), 0 2px 6px rgba(16,24,40,.12), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.14);
      --btn-shadow-hover: 0 3px 6px rgba(16,24,40,.22), 0 8px 18px rgba(16,24,40,.16), inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 0 rgba(0,0,0,.14);
    }
    @media (prefers-color-scheme: light) {
      :root[data-theme="auto"] {
        color-scheme: light;
        --bg: #f4f5f7; --text: #222; --muted: #6b7280; --go-bg: #ffffff; --go-border: #d9dde2;
        --line: #e1e4e8; --chip-bg: #ffffff; --chip-border: #d9dde2; --chip-text: #444; --chip-hover: #111;
        --accent: #2a9d87; --on-accent: #fff;
      --outer: #e4e7eb; --frame-border: #d9dde2; --frame-shadow: rgba(0,0,0,.12);
      --btn-shadow: 0 1px 2px rgba(16,24,40,.22), 0 2px 6px rgba(16,24,40,.12), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.14);
      --btn-shadow-hover: 0 3px 6px rgba(16,24,40,.22), 0 8px 18px rgba(16,24,40,.16), inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 0 rgba(0,0,0,.14);
      }
    }
    /* Вікно: зовнішнє тло + заокруглена рамка, як у меню біля ⚡ */
    body { width: 282px; padding: 6px; background: var(--outer); color: var(--text); font-family: 'Rubik', sans-serif; margin: 0; box-sizing: border-box; }
    .frame {
      background: var(--bg); border: 1px solid var(--frame-border); border-radius: 12px;
      padding: 12px; box-shadow: 0 8px 24px var(--frame-shadow); overflow: hidden;
    }

    /* Один зазор (--gap) для всіх кнопок: і між рядами, і всередині ряду */
    :root { --gap: 6px; }
    .container { display: flex; flex-direction: column; gap: var(--gap); }
    .row { display: flex; gap: var(--gap); align-items: center; min-width: 0; }
    .mini-group { flex: 1; display: flex; gap: var(--gap); min-width: 0; }

    button {
      position: relative; cursor: pointer; border: none; border-radius: 6px; font-weight: 500;
      display: flex; align-items: center; justify-content: center; outline: none; font-family: inherit;
      /* Плавне збільшення без «тремтіння» тексту:
         кнопка рендериться окремим шаром відеокарти, анімуються лише transform / тінь / яскравість,
         а text-shadow не змінюється (його анімація змушувала текст перемальовуватись щокадру). */
      transform: translateZ(0); backface-visibility: hidden; will-change: transform;
      -webkit-font-smoothing: antialiased;
      transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, filter .18s ease;
    }
    button:active { transform: translateZ(0) scale(.97); transition-duration: .08s; }
    .btn-search, .btn-mini {
      flex: 1; min-width: 0; height: 38px; padding: 0 6px;
      text-transform: uppercase; text-shadow: 2px 2px 3px rgba(0,0,0,0.8); color: #fff;
      box-shadow: var(--btn-shadow);
    }
    .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Збільшення підібране так, щоб кнопка росла менше ніж на половину зазору й не наїжджала на сусідів */
    .btn-search:hover { transform: translateZ(0) scale(1.02); box-shadow: var(--btn-shadow-hover); filter: brightness(1.06); z-index: 1; }
    .btn-mini:hover   { transform: translateZ(0) scale(1.03); box-shadow: var(--btn-shadow-hover); filter: brightness(1.06); z-index: 1; }
    .btn-go { flex: none; width: 42px; height: 38px; background: var(--go-bg); color: #00ff88; font-size: 18px; border: 1px solid var(--go-border); box-shadow: var(--btn-shadow); }
    .btn-go:hover {
      transform: translateZ(0) scale(1.06); z-index: 1;
      box-shadow: 0 0 4px rgba(255, 149, 0, 0.3), var(--btn-shadow-hover);
      filter: drop-shadow(0 0 3px rgba(255, 170, 0, 0.45));
    }
    .ico { width: 1.25em; height: 1.25em; margin-right: .4em; flex: none; border-radius: 3px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
    .history { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
    .history-head { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .history-clear { cursor: pointer; }
    .history-clear:hover { color: #e04848; }
    .history-list { display: flex; flex-wrap: wrap; gap: 4px; max-height: 92px; overflow-y: auto; }
    .chip { font-size: 11px; background: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--chip-text); padding: 3px 8px; border-radius: 10px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-sizing: border-box; }
    .chip:hover { border-color: var(--accent); color: var(--chip-hover); }
    .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    #hint { font-size: 10px; color: var(--muted); margin-bottom: 10px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="frame" id="frame">
    <div id="hint">Виділіть назву на сторінці</div>
    <div class="container" id="main-container"></div>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
